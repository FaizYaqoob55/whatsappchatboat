# render.yaml — Render.com pe deploy karne ke liye
# Render dashboard mein "New > Blueprint" se yeh file use karo

services:
  - type: web
    name: whatsapp-chatbot
    env: python
    region: oregon
    plan: free                    # free tier se shuru karo
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false               # Render dashboard mein manually set karo
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: BUSINESS_NAME
        value: My Online Store
